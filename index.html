<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>농가 평가체계 AHP 설문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow reading column; a stepper rail on top; each comparison is a ruled card with a 17-point scale. */
:root{
  --bg:#f4f6f2; --surface:#ffffff; --fg:#1c231e; --muted:#5b665e; --line:#dbe1d9;
  --accent:#3d6a48; --accent-fg:#ffffff; --accent-weak:#e2ebe2;
  --warn:#a9521c; --warn-bg:#f8e9df; --ok:#2e7a4c; --ok-bg:#e1f0e6;
  --display:"Gowun Batang", "Noto Serif KR", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111512; --surface:#191f1b; --fg:#e4eae5; --muted:#99a59c; --line:#2b342e;
  --accent:#86b691; --accent-fg:#0f1a12; --accent-weak:#22332670;
  --warn:#e6955f; --warn-bg:#3a251a; --ok:#7fcb9b; --ok-bg:#1c3325; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111512; --surface:#191f1b; --fg:#e4eae5; --muted:#99a59c; --line:#2b342e;
  --accent:#86b691; --accent-fg:#0f1a12; --accent-weak:#22332670;
  --warn:#e6955f; --warn-bg:#3a251a; --ok:#7fcb9b; --ok-bg:#1c3325; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.7rem} h2{font-size:1.3rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent);font-weight:600}
.rail{display:flex;gap:6px;flex-wrap:wrap}
.rail span{font-size:.78rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.rail span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.rail span.done{color:var(--fg);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:500;font-size:.9rem}
input[type=text],select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:90px;font-family:var(--mono);font-size:.8rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:7px 14px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:10px 18px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line);font-weight:500}
.btn.link{background:none;border:0;color:var(--warn);text-decoration:underline;padding:4px 0;font-weight:500}
.scalekey{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:.78rem;color:var(--muted)}
.scalekey div{border-top:2px solid var(--line);padding-top:4px}
.rank{display:flex;flex-direction:column;gap:6px}
.rank li{list-style:none;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px 6px 12px}
.rank ol{margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank .pos{font-family:var(--mono);color:var(--accent);width:2.2em}
.rank .name{flex:1;min-width:0}
.rank button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;width:32px;height:30px;padding:0}
.rank button:disabled{opacity:.3}
.pair{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.pair.bad{background:var(--warn-bg);border-radius:8px;padding:12px;border-top-color:transparent}
.ends{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.ends span:last-child{text-align:right}
.scale{display:grid;grid-template-columns:repeat(17,minmax(0,1fr));gap:3px}
.scale button{aspect-ratio:1/1.15;max-width:100%;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:5px;padding:0;font-family:var(--mono);font-size:.72rem}
.scale button.odd{color:var(--fg)}
.scale button.mid{border-color:var(--muted)}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.readout{font-size:.85rem;color:var(--muted);min-height:1.4em}
.hint{font-size:.82rem;color:var(--warn)}
.status{border-radius:8px;padding:12px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.status.ok{background:var(--ok-bg);color:var(--fg)}
.status.ok b{color:var(--ok)}
.status.bad{background:var(--warn-bg)}
.status.bad b{color:var(--warn)}
.status.wait{background:var(--accent-weak);color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.78rem}
td.r,th.r{text-align:right}
.bar{height:8px;background:var(--accent-weak);border-radius:4px;min-width:60px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.pill{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--warn-bg);color:var(--warn)}
.pill.na{background:var(--accent-weak);color:var(--muted)}
.code{font-family:var(--mono);font-size:.75rem;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:140px;overflow:auto;user-select:all}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .v{font-family:var(--mono);font-size:1.3rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.88rem}
@media (max-width:480px){.scale button{font-size:.6rem;border-radius:4px}.scale{gap:2px}.card{padding:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.treewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px}
.tree{display:block;width:100%;min-width:480px;height:auto}
.tree .edge{fill:none;stroke:var(--muted);stroke-width:1}
.tree .node{stroke:var(--accent);stroke-width:1}
.tree .node.d0{fill:var(--accent)}
.tree .node.d1{fill:var(--accent-weak)}
.tree .node.d2{fill:var(--surface)}
.tree .label{font-family:var(--body);font-size:12px;fill:var(--fg)}
.tree .label.d0{fill:var(--accent-fg);font-weight:600;font-size:11.5px}
.tree .label.d1{font-weight:600}
.treehead{position:relative;height:18px;min-width:480px;font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.treehead span{position:absolute;text-align:center}
.wbars{display:flex;flex-direction:column;gap:6px}
.wrow{display:grid;grid-template-columns:minmax(80px,9em) 1fr 4em;gap:10px;align-items:center}
.wrow .wname{font-size:.88rem;min-width:0}
tr.strong td{font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:6px">
    <span class="eyebrow">농업 빅데이터 및 기술경제 연구실</span>
    <h1>농가 단위 환경·사회·경제 평가체계 가중치 설문</h1>
  </header>
  <main id="survey" class="wrap" style="gap:16px;width:100%"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script>
/* ===== 설정 ===== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxjb7cBOST-OreiyItTqhj4q3BQ-C5uA6l-mt8g34uAMgDhSBoEErtmk36oQLsa7xoY1g/exec";

/* ===== 평가 계층 =====
   항목을 추가·삭제하거나 한 단계 더 아래(지표)를 붙이려면 children만 고치면 됩니다.
   Code.gs의 TREE도 똑같이 맞춰 주세요. id는 한 번 정하면 바꾸지 마세요. */
const TREE = {id:"G", name:"농가 단위 가치 평가", children:[
  {id:"E", name:"환경", children:[{id:"E1",name:"토양"},{id:"E2",name:"수질"},{id:"E3",name:"대기"},{id:"E4",name:"생태"}]},
  {id:"S", name:"사회", children:[{id:"S1",name:"인적 기반"},{id:"S2",name:"영농 활동 기반"},{id:"S3",name:"지역사회 기반"}]},
  {id:"C", name:"경제", children:[{id:"C1",name:"수익성"},{id:"C2",name:"생산성"},{id:"C3",name:"안정성"}]},
]};

/* ---------- 계층 → 비교 묶음 ---------- */
const NODES = {};
(function walk(n, parent, depth){ n.parent=parent; n.depth=depth; NODES[n.id]=n; (n.children||[]).forEach(c=>walk(c,n,depth+1)); })(TREE,null,0);
const GROUPS = [];
(function collect(n){ if(n.children && n.children.length>=2){
  const isTop = n.depth===0;
  GROUPS.push({id:n.id, node:n, items:n.children.map(c=>c.name),
    title: isTop ? "부문 간 비교" : (n.depth===1 ? `${n.name} 부문` : n.name),
    parentLabel: isTop ? "평가체계 전체" : n.name,
    q: isTop ? "농가의 가치를 평가할 때, 두 부문 중 어느 쪽이 더 중요하다고 보십니까?"
             : (n.depth===1 ? `${n.name} 부문 안에서, 두 요소 중 어느 쪽이 더 중요하다고 보십니까?`
                            : `'${n.name}'을(를) 평가할 때, 두 요소 중 어느 쪽이 더 중요하다고 보십니까?`)});
  } (n.children||[]).forEach(collect); })(TREE);

const RI = [0,0,0,0.58,0.90,1.12,1.24,1.32,1.41,1.45,1.49,1.51,1.48,1.56,1.57,1.59];
const INTENSITY = {1:"동등하게",2:"동등~약간 더",3:"약간 더",4:"약간~상당히 더",5:"상당히 더",6:"상당히~매우 더",7:"매우 더",8:"매우~극히 더",9:"극히 더"};
const STEPS = ["시작", ...GROUPS.map(g=>g.title), "확인"];
const DRAFT_KEY = "ahp-farm-draft-v2";

/* ---------- AHP 계산 ---------- */
const pairs = n => { const p=[]; for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) p.push([i,j]); return p; };
const sToA = s => s<9 ? 10-s : s===9 ? 1 : 1/(s-8);
function matrixFrom(n, getA){ const A=[...Array(n)].map(()=>Array(n).fill(1)); for(const [i,j] of pairs(n)){ const a=getA(i,j); A[i][j]=a; A[j][i]=1/a; } return A; }
function analyze(A){
  const n=A.length;
  const gm=A.map(r=>Math.pow(r.reduce((x,y)=>x*y,1),1/n));
  const s=gm.reduce((x,y)=>x+y,0); const w=gm.map(g=>g/s);
  const Aw=A.map(r=>r.reduce((acc,v,j)=>acc+v*w[j],0));
  const lam=Aw.reduce((acc,v,i)=>acc+v/w[i],0)/n;
  const CI=n>2?(lam-n)/(n-1):0; const CR=n>2?CI/RI[n]:0;
  return {w,lam,CI,CR:Math.max(0,CR)};
}
function worstPair(A,w){ let best=null; for(const [i,j] of pairs(A.length)){ const e=Math.abs(Math.log(A[i][j]*w[j]/w[i])); if(!best||e>best.e) best={i,j,e,target:w[i]/w[j]}; } return best; }
const groupDone = (gs,g) => pairs(g.items.length).every(([i,j])=>gs && gs.s[i+"-"+j]);
function groupResult(g, gs){ if(!groupDone(gs,g)) return null; const A=matrixFrom(g.items.length,(i,j)=>sToA(gs.s[i+"-"+j])); return {A,...analyze(A)}; }
function globalWeights(groupsState){
  const out={}; out[TREE.id]=1; const local={};
  (function go(n){ const g=GROUPS.find(x=>x.id===n.id);
    if(n.children){ let r=null;
      if(g) r=groupResult(g,groupsState[g.id]);
      n.children.forEach((c,i)=>{ const lw = n.children.length===1 ? 1 : (r ? r.w[i] : NaN); local[c.id]=lw; out[c.id]=out[n.id]*lw; go(c); }); }
  })(TREE);
  return {global:out, local};
}

/* ---------- 상태 ---------- */
function freshState(){ const g={}; for(const G of GROUPS) g[G.id]={s:{},blocked:0,override:false}; return {step:0,evaluator:"",g,submitted:false}; }
let S = freshState();
try{ const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null"); if(d && d.g){ S={...S,...d}; for(const G of GROUPS) if(!S.g[G.id]) S.g[G.id]=freshState().g[G.id]; } }catch(e){}
function saveDraft(){ try{ localStorage.setItem(DRAFT_KEY,JSON.stringify(S)); }catch(e){} }

const $ = id => document.getElementById(id);
const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else if(v===true) e.setAttribute(k,""); else if(v!==false && v!=null) e.setAttribute(k,v); } for(const k of kids.flat()){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(String(k))); } return e; };
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2400); }
const fmt = (x,d=3) => Number.isFinite(x)?x.toFixed(d):"–";
const pct = x => Number.isFinite(x)?(x*100).toFixed(1)+"%":"–";
const go = step => { S.step=step; saveDraft(); render(); window.scrollTo(0,0); };

/* ---------- 계층도 ---------- */
function hierarchySVG(){
  const NS="http://www.w3.org/2000/svg";
  const leaves=[]; (function L(n){ if(!n.children) leaves.push(n); else n.children.forEach(L); })(TREE);
  const maxDepth=Math.max(...Object.values(NODES).map(n=>n.depth));
  const rowH=34, padY=10, boxH=26;
  const colW=[150,110,...Array(Math.max(0,maxDepth-1)).fill(130)];
  const gap=34;
  const xs=[0]; for(let d=1; d<=maxDepth; d++) xs[d]=xs[d-1]+colW[d-1]+gap;
  const W=xs[maxDepth]+colW[maxDepth]+2, H=leaves.length*rowH+padY*2;
  const pos={};
  leaves.forEach((n,i)=>pos[n.id]={y:padY+i*rowH+rowH/2});
  (function Y(n){ if(n.children){ n.children.forEach(Y); pos[n.id]={y:(pos[n.children[0].id].y+pos[n.children[n.children.length-1].id].y)/2}; } })(TREE);
  const svg=document.createElementNS(NS,"svg"); svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("class","tree"); svg.setAttribute("role","img"); svg.setAttribute("aria-label","평가 계층도");
  const mk=(t,a)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; };
  for(const n of Object.values(NODES)) if(n.children){
    const x1=xs[n.depth]+colW[n.depth], xm=x1+gap/2, x2=xs[n.depth+1];
    svg.append(mk("path",{d:`M${x1} ${pos[n.id].y}H${xm}`,class:"edge"}));
    const ys=n.children.map(c=>pos[c.id].y);
    svg.append(mk("path",{d:`M${xm} ${Math.min(...ys)}V${Math.max(...ys)}`,class:"edge"}));
    n.children.forEach(c=>svg.append(mk("path",{d:`M${xm} ${pos[c.id].y}H${x2}`,class:"edge"})));
  }
  for(const n of Object.values(NODES)){
    const x=xs[n.depth], w=colW[n.depth], y=pos[n.id].y;
    svg.append(mk("rect",{x, y:y-boxH/2, width:w, height:boxH, rx:5, class:"node d"+Math.min(n.depth,2)}));
    const t=mk("text",{x:x+w/2, y:y+4.5, "text-anchor":"middle", class:"label d"+Math.min(n.depth,2)});
    t.textContent=n.name; svg.append(t);
  }
  const heads=["목표","부문","요소","세부 지표"];
  return el("div",{class:"field"},
    el("div",{class:"treehead"}, ...Array.from({length:maxDepth+1},(_,d)=>el("span",{style:`left:${(xs[d]/W*100).toFixed(2)}%;width:${(colW[d]/W*100).toFixed(2)}%`},heads[d]||`${d}계층`))),
    el("div",{class:"treewrap"},svg));
}

/* ---------- 화면 ---------- */
function rail(){ return el("div",{class:"rail"}, STEPS.map((s,i)=>el("span",{class:i===S.step?"on":i<S.step?"done":""},s))); }
function render(){
  const root=$("survey"); root.replaceChildren();
  if(S.submitted){ root.append(doneView()); return; }
  root.append(rail());
  if(S.step===0) root.append(introView());
  else if(S.step<=GROUPS.length) root.append(groupView(GROUPS[S.step-1]));
  else root.append(reviewView());
}

function introView(){
  const c=el("div",{class:"card"});
  const total=GROUPS.reduce((a,g)=>a+pairs(g.items.length).length,0);
  c.append(
    el("p",{},"본 설문은 개별 농가의 환경·사회·경제 부문 가치를 평가하기 위해, 각 평가 요소의 상대적 중요도(가중치)를 전문가 판단으로 산출하는 AHP(계층분석법) 조사입니다."),
    el("h2",{},"평가 계층"),
    hierarchySVG(),
    el("p",{class:"muted small"},`같은 상위 항목 아래의 요소끼리 두 개씩 짝지어 비교합니다. 비교 묶음은 ${GROUPS.length}개, 문항은 모두 ${total}개입니다. 응답하신 값으로 계산한 하위 요소의 가중치는 상위 항목의 가중치와 곱해져 최종 가중치가 됩니다.`),
  );
  c.append(el("div",{class:"field"}, el("span",{class:"eyebrow"},"척도 읽는 법"),
    el("div",{class:"scalekey"}, ["1 동등","3 약간 더","5 상당히 더","7 매우 더","9 극히 더"].map(t=>el("div",{},t))),
    el("p",{class:"muted small"},"2·4·6·8은 그 사이 값입니다. 가운데(1)에서 더 중요한 쪽으로 갈수록 숫자가 커집니다."),
    el("p",{class:"small"},"숫자는 '몇 배 더 중요한가'로 계산됩니다. 그래서 A가 B보다 3, B가 C보다 3만큼 중요하다고 답하시면 A는 C보다 9만큼 중요한 것으로 이어집니다. 응답이 서로 크게 어긋나면 화면에서 알려 드립니다.")));
  const num=el("input",{type:"text",id:"in-evaluator",value:S.evaluator,autocomplete:"off",placeholder:"예: P01",oninput:e=>{S.evaluator=e.target.value;saveDraft();check();}});
  const next=el("button",{class:"btn",onclick:()=>go(1)},"설문 시작");
  function check(){ next.disabled=!S.evaluator.trim(); }
  check();
  c.append(el("div",{class:"field"},el("label",{for:"in-evaluator"},"평가자 번호"),num,el("span",{class:"muted small"},"안내받은 번호를 입력해 주세요. 응답은 이름 없이 번호로만 저장됩니다.")),
    el("div",{class:"btns",style:"justify-content:flex-end"},next));
  return c;
}

function groupView(g){
  const gs=S.g[g.id], n=g.items.length;
  const c=el("div",{class:"card"});
  c.append(el("div",{class:"field",style:"gap:2px"},
    el("span",{class:"eyebrow"},`${S.step} / ${GROUPS.length} · 상위 항목: ${g.parentLabel}`), el("h2",{},g.title)));

  c.append(el("p",{style:"font-weight:500"},g.q), el("p",{class:"muted small"},"9 극히 · 7 매우 · 5 상당히 · 3 약간 · 1 동등"));
  const res=groupResult(g,gs);
  const bad = res && res.CR>0.1 ? worstPair(res.A,res.w) : null;
  for(const [i,j] of pairs(n)){
    const L=i, R=j, key=i+"-"+j, cur=gs.s[key], dcur=cur||null;
    const setK = k => { gs.s[key]=k; saveDraft(); render(); };
    const isBad = bad && bad.i===i && bad.j===j;
    const scale=el("div",{class:"scale",role:"radiogroup","aria-label":`${g.items[L]} 대 ${g.items[R]}`});
    for(let k=1;k<=17;k++){ const v=k<=9?10-k:k-8;
      scale.append(el("button",{type:"button",class:(v%2?"odd ":"")+(k===9?"mid":""),"aria-pressed":String(dcur===k),
        "aria-label":v===1?"동등":(k<9?`${g.items[L]} ${v}`:`${g.items[R]} ${v}`),onclick:()=>setK(k)},v)); }
    let read="";
    if(dcur){ const v=dcur<=9?10-dcur:dcur-8; read = v===1 ? "두 요소가 동등하게 중요" : `${dcur<9?g.items[L]:g.items[R]}이(가) ${INTENSITY[v]} 중요 (${v})`; }
    const p=el("div",{class:"pair"+(isBad?" bad":"")},
      el("div",{class:"ends"},el("span",{},`← ${g.items[L]}`),el("span",{},`${g.items[R]} →`)), scale, el("div",{class:"readout"},read));
    if(isBad){
      const natural = bad.target>=1 ? i : j;          // 나머지 응답이 가리키는 더 중요한 쪽
      const chosen  = cur<9 ? i : cur>9 ? j : -1;
      const msg = chosen!==-1 && chosen!==natural ? "다른 문항의 응답과 비교하면 이 문항의 방향이 반대로 보입니다." : "다른 문항의 응답과 가장 크게 어긋나는 문항입니다.";
      p.append(el("div",{class:"hint"},`${msg} 이 문항이나 관련된 다른 문항을 다시 검토해 주세요.`));
    }
    c.append(p);
  }

  const answered=pairs(n).filter(([i,j])=>gs.s[i+"-"+j]).length, total=pairs(n).length;
  let status;
  if(!res) status=el("div",{class:"status wait"},`${answered} / ${total} 문항 응답`);
  else if(n<=2) status=el("div",{class:"status ok"},el("b",{},"응답 완료"));
  else if(res.CR<=0.1) status=el("div",{class:"status ok"},el("span",{},el("b",{},"일관성 양호 "),el("span",{class:"num"},`CR ${fmt(res.CR)}`)));
  else status=el("div",{class:"status bad"},el("span",{},el("b",{},"일관성 부족 "),el("span",{class:"num"},`CR ${fmt(res.CR)} (기준 0.1 이하)`)),
    el("span",{class:"small"},"A가 B보다, B가 C보다 중요하다고 하셨다면 A는 C보다 더 중요해야 자연스럽습니다. 표시된 문항을 중심으로 응답을 다시 살펴봐 주세요."));
  c.append(status);

  const next=el("button",{class:"btn",disabled:!res},"다음");
  next.onclick=()=>{
    if(n>2 && res.CR>0.1 && !gs.override){ gs.blocked++; saveDraft(); render(); toast("표시된 문항을 다시 검토해 주세요"); return; }
    if(res.CR<=0.1) gs.override=false;
    go(S.step+1);
  };
  const right=el("div",{class:"btns",style:"justify-content:flex-end"});
  if(res && n>2 && res.CR>0.1 && gs.blocked>0)
    right.append(el("button",{class:"btn link",onclick:()=>{gs.override=true;go(S.step+1);}},"검토했습니다. 현재 응답으로 진행"));
  right.append(next);
  c.append(el("div",{class:"btns"},el("button",{class:"btn ghost",onclick:()=>go(S.step-1)},"이전"),right));
  return c;
}

function weightTable(gw){
  const t=el("table",{},el("tr",{},el("th",{},"항목"),el("th",{class:"r"},"상위 항목 안 비중"),el("th",{class:"r"},"최종 가중치"),el("th",{})));
  const max=Math.max(...Object.entries(gw.global).filter(([id])=>!NODES[id].children).map(([,v])=>v||0));
  (function rows(n){ for(const c of n.children||[]){
    const leaf=!c.children;
    t.append(el("tr",{class:leaf?"":"strong"},
      el("td",{style:`padding-left:${8+ (c.depth-1)*18}px`},c.name),
      el("td",{class:"r num"},pct(gw.local[c.id])), el("td",{class:"r num"},fmt(gw.global[c.id],4)),
      el("td",{style:"width:28%"}, leaf?el("div",{class:"bar"},el("i",{style:`width:${((gw.global[c.id]||0)/max*100).toFixed(1)}%`})):null)));
    rows(c); } })(TREE);
  return el("div",{class:"tablewrap"},t);
}

function reviewView(){
  const c=el("div",{class:"card"});
  c.append(el("h2",{},"응답 확인"), el("p",{class:"muted small"},"응답으로 계산된 본인의 가중치입니다. 최종 가중치는 상위 항목의 가중치에 상위 항목 안 비중을 곱한 값이며, 맨 아래 요소의 최종 가중치를 모두 더하면 1이 됩니다."));
  c.append(weightTable(globalWeights(S.g)));
  const crList=el("div",{class:"btns",style:"justify-content:flex-start;gap:6px"});
  GROUPS.forEach((g,gi)=>{ const r=groupResult(g,S.g[g.id]); const ok=g.items.length<=2||r.CR<=0.1;
    crList.append(el("button",{class:"pill "+(ok?"ok":"bad"),style:"border:0;cursor:pointer",onclick:()=>go(gi+1)},`${g.title}${g.items.length>2?" · CR "+fmt(r.CR):""}`)); });
  c.append(el("div",{class:"field"},el("span",{class:"eyebrow"},"묶음별 일관성 (누르면 수정)"),crList));
  const submit=el("button",{class:"btn"},"제출하기");
  submit.onclick=async()=>{
    submit.disabled=true; submit.textContent="제출 중…";
    const payload=buildPayload(); let ok=false;
    try{ const res=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(payload)}); const out=await res.json(); ok=!!(out&&out.ok); }catch(e){ ok=false; }
    S.submitted=true; S.via=ok?"sheet":"code"; if(!ok) S.code=encodePayload(payload);
    saveDraft(); render(); window.scrollTo(0,0);
  };
  c.append(el("div",{class:"btns"},el("button",{class:"btn ghost",onclick:()=>go(S.step-1)},"이전"),submit));
  return c;
}

function buildPayload(){
  const groups={};
  for(const g of GROUPS){ const gs=S.g[g.id], r=groupResult(g,gs); groups[g.id]={s:{...gs.s},cr:+r.CR.toFixed(4),override:!!gs.override,blocked:gs.blocked}; }
  return {schema:2,evaluator:S.evaluator.trim(),groups,submittedAt:new Date().toISOString()};
}
const encodePayload = p => "AHP2:"+btoa(unescape(encodeURIComponent(JSON.stringify(p))));

function doneView(){
  const c=el("div",{class:"card"});
  if(S.via==="sheet"){
    c.append(el("h2",{},"제출되었습니다"),el("p",{},`평가자 ${S.evaluator} 님, 응답해 주셔서 감사합니다.`),
      el("p",{class:"muted small"},"수정이 필요하시면 아래 버튼으로 응답을 고쳐 다시 제출하실 수 있습니다. 같은 평가자 번호로 다시 제출하면 이전 응답을 대체합니다."));
  } else {
    const code=el("div",{class:"code"},S.code);
    const copy=el("button",{class:"btn"},"응답 코드 복사");
    copy.onclick=async()=>{ try{ await navigator.clipboard.writeText(S.code); toast("복사했습니다"); }catch(e){ const r=document.createRange(); r.selectNodeContents(code); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("코드를 선택했습니다. 복사해 주세요"); } };
    c.append(el("h2",{},"응답 코드를 보내 주세요"),
      el("p",{},"네트워크 문제로 응답을 자동 저장하지 못했습니다. 아래 코드를 복사해 연구진에게 보내 주시면 응답이 그대로 반영됩니다."),
      code, el("div",{class:"btns",style:"justify-content:flex-end"},copy));
  }
  c.append(el("div",{class:"btns",style:"justify-content:flex-start"},el("button",{class:"btn ghost",onclick:()=>{S.submitted=false;go(GROUPS.length+1);}},"응답 수정하기")));
  return c;
}

render();
</script>
